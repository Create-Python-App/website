reason = "minimatch (ReDoS, fixed in 11.0.1) is a transitive dependency of the ESLint and typescript-eslint toolchain: 3.1.4 and 3.1.5 via eslint 9, 10.2.6 via typescript-estree. It only parses glob patterns from repository config, never untrusted input, so it is not reachable from the shipped site. Latest typescript-eslint still requires ^10.2.2, and an override is not applied to already-pinned lock entries. Remove this exception once typescript-eslint requires minimatch >= 11.0.1, or once a pnpm override is approved and applied."
